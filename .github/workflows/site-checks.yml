name: The Motor Trade site checks
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'auction-hall-view.js'
      - 'buying-desk-view.js'
      - 'stock-view.js'
      - 'finance-view.js'
      - 'dashboard-view.js'
      - 'inbox-office.js'
      - 'dashboard-view.js'
      - 'simulator.js'
      - 'career-storage.js'
      - 'cloud-config.js'
      - 'cloud-careers.js'
      - 'cloud-account-ui.js'
      - 'supabase/**'
      - 'trading.js'
      - 'motor-group.js'
      - 'dealer-delegation.js'
      - 'dealer-principal.css'
      - 'group-headquarters-view.js'
      - 'group-headquarters.css'
      - 'vehicle-photos.js'
      - 'vehicle-market.js'
      - 'vehicle-accuracy.js'
      - 'vehicle-cards.js'
      - 'customers.js'
      - 'aftersales.js'
      - 'stock-ageing.js'
      - 'cashflow-forecast.js'
      - 'customers-view.js'
      - 'aftersales-view.js'
      - 'workshop.js'
      - 'workshop-view.js'
      - 'showroom-traffic.js'
      - 'events.js'
      - 'events-view.js'
      - 'monthly.js'
      - 'monthly-view.js'
      - 'premises.js'
      - 'premises-view.js'
      - 'people.js'
      - 'people-view.js'
      - 'vehicle-intel.js'
      - 'vehicle-view.js'
      - 'favicon.svg'
      - '404.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'buying-desk-view.js'
      - 'stock-view.js'
      - 'finance-view.js'
      - 'simulator.js'
      - 'career-storage.js'
      - 'cloud-config.js'
      - 'cloud-careers.js'
      - 'cloud-account-ui.js'
      - 'supabase/**'
      - 'trading.js'
      - 'motor-group.js'
      - 'dealer-delegation.js'
      - 'dealer-principal.css'
      - 'group-headquarters-view.js'
      - 'group-headquarters.css'
      - 'vehicle-photos.js'
      - 'vehicle-market.js'
      - 'vehicle-accuracy.js'
      - 'vehicle-cards.js'
      - 'customers.js'
      - 'customers-view.js'
      - 'workshop.js'
      - 'workshop-view.js'
      - 'events.js'
      - 'events-view.js'
      - 'monthly.js'
      - 'monthly-view.js'
      - 'premises.js'
      - 'premises-view.js'
      - 'people.js'
      - 'people-view.js'
      - 'vehicle-intel.js'
      - 'vehicle-view.js'
      - 'favicon.svg'
      - '404.html'
      - 'assets/**'
      - 'tests/**'
      - '.github/workflows/site-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game JavaScript syntax
        run: node --check vehicle-intel.js && node --check vehicle-photos.js && node --check vehicle-accuracy.js && node --check vehicle-market.js && node --check vehicle-cards.js && node --check vehicle-view.js && node --check premises.js && node --check premises-view.js && node --check people.js && node --check people-view.js && node --check monthly.js && node --check monthly-view.js && node --check events.js && node --check events-view.js && node --check workshop.js && node --check workshop-view.js && node --check customers.js && node --check aftersales.js && node --check stock-ageing.js && node --check showroom-traffic.js && node --check cashflow-forecast.js && node --check customers-view.js && node --check motor-group.js && node --check dealer-delegation.js && node --check group-headquarters-view.js && node --check trading.js && node --check auction-hall-view.js && node --check buying-desk-view.js && node --check stock-view.js && node --check finance-view.js && node --check dashboard-view.js && node --check inbox-office.js && node --check career-storage.js && node --check cloud-config.js && node --check cloud-careers.js && node --check cloud-account-ui.js && node --check simulator.js
      - name: Validate current site, financial ledger and cross-feature career interactions
        run: |
          node --test tests/site.test.mjs tests/career-storage.test.mjs tests/cloud-careers.test.mjs tests/showroom-traffic.test.mjs tests/customer-behaviour.test.mjs tests/staff-workshop-impact.test.mjs tests/staff-performance.test.mjs tests/aftersales.test.mjs tests/stock-ageing.test.mjs tests/cashflow-forecast.test.mjs tests/group-headquarters.test.mjs tests/dealer-delegation.test.mjs
