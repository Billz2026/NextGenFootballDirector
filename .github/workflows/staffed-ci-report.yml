name: Temporary CI failure report to review branch
on:
  pull_request:
    paths:
      - 'tests/site.test.mjs'
      - '.github/workflows/staffed-ci-report.yml'
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Save failing test diagnostics to temporary branch file
        shell: bash
        run: |
          node --test tests/site.test.mjs tests/career-storage.test.mjs tests/cloud-careers.test.mjs > /tmp/staffed-test.log 2>&1 || true
          node - <<'NODE'
          const fs=require('fs');
          const lines=fs.readFileSync('/tmp/staffed-test.log','utf8').split('\n');
          const failures=lines.flatMap((s,i)=>/^not ok \d+ /.test(s)?[lines.slice(i,i+24).join('\n')]:[]);
          fs.mkdirSync('tmp',{recursive:true});
          fs.writeFileSync('tmp/staffed-ci-failures.txt',
            lines.filter(s=>/^# (tests|pass|fail|duration_ms)/.test(s)).join('\n')+
            '\n\n'+failures.join('\n\n').slice(0,45000));
          NODE
          git config user.name "CI Diagnostics"
          git config user.email "ci-diagnostics@users.noreply.github.com"
          git add tmp/staffed-ci-failures.txt
          git commit -m "Temporary CI assertion results for PR review"
          git push origin HEAD:${{ github.head_ref }}
