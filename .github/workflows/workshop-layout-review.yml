name: Workshop desktop and phone visual review
on:
  pull_request:
    paths:
      - 'workshop-view.js'
      - 'workshop-polish.css'
      - 'index.html'
      - 'tests/workshop-visual-browser.mjs'
      - '.github/workflows/workshop-layout-review.yml'
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate review script
        run: node --check tests/workshop-visual-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve actual game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/workshop-browser-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
      - name: Exercise real repair decisions and capture desktop and phone views
        run: node tests/workshop-visual-browser.mjs
      - name: Upload actual Chromium screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-desktop-phone
          path: review/workshop-*.png
          retention-days: 7
          if-no-files-found: warn
