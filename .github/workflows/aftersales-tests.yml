name: Aftersales consequences regression
on:
  pull_request:
    paths:
      - 'aftersales.js'
      - 'aftersales-view.js'
      - 'aftersales-polish.css'
      - 'trading.js'
      - 'simulator.js'
      - 'monthly.js'
      - 'monthly-view.js'
      - 'finance-view.js'
      - 'cashflow-forecast.js'
      - 'index.html'
      - 'tests/aftersales.test.mjs'
      - 'tests/aftersales-visual-browser.mjs'
      - '.github/workflows/aftersales-tests.yml'
  push:
    branches: [main]
    paths:
      - 'aftersales.js'
      - 'aftersales-view.js'
      - 'aftersales-polish.css'
      - 'trading.js'
      - 'simulator.js'
      - 'monthly.js'
      - 'monthly-view.js'
      - 'finance-view.js'
      - 'cashflow-forecast.js'
      - 'index.html'
      - 'tests/aftersales.test.mjs'
      - 'tests/aftersales-visual-browser.mjs'
      - '.github/workflows/aftersales-tests.yml'
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check engine and view syntax
        run: |
          node --check aftersales.js && node --check aftersales-view.js
          node --check trading.js && node --check simulator.js
          node --check finance-view.js && node --check monthly.js
          node --check monthly-view.js && node --check cashflow-forecast.js
      - name: Test real handover, aftersales, cashflow, customer and workshop regressions
        run: |
          node --test tests/aftersales.test.mjs tests/customer-behaviour.test.mjs tests/cashflow-forecast.test.mjs tests/staff-workshop-impact.test.mjs tests/stock-ageing.test.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script
        run: node --check tests/aftersales-visual-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve actual game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/aftersales-browser.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
      - name: Verify post-sale complaint flow at desktop and mobile
        run: node tests/aftersales-visual-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aftersales-desktop-phone
          path: review/aftersales-*.png
          retention-days: 7
          if-no-files-found: warn
