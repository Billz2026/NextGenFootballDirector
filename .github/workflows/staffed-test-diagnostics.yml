name: Temporary opening-team regression diagnostics
on:
  pull_request:
    paths:
      - 'people.js'
      - 'monthly.js'
      - 'trading.js'
      - 'simulator.js'
      - 'index.html'
      - 'tests/site.test.mjs'
      - '.github/workflows/staffed-test-diagnostics.yml'
permissions:
  contents: read
  issues: write
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run test suite and comment only failing assertions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          node --test tests/site.test.mjs tests/career-storage.test.mjs tests/cloud-careers.test.mjs > /tmp/staffed-test.log 2>&1 || true
          node - <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('/tmp/staffed-test.log','utf8').split('\n');
          const failures = lines.flatMap((line,i) => /^not ok \d+ /.test(line) ? [lines.slice(i,i+21).join('\n')] : []);
          const summary = lines.filter(s=>/^# (tests|pass|fail|duration_ms)/.test(s)).join('\n');
          fs.writeFileSync('/tmp/staffed-comment.md',
            '### Temporary staffed-career test diagnostics\n\n' +
            '```text\n' + (summary + '\n\n' + failures.join('\n\n')).slice(0,49000) + '\n```\n');
          NODE
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@/tmp/staffed-comment.md
