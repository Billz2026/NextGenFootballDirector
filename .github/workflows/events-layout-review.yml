name: Deal Day and Meetings desktop and phone visual review
on:
  pull_request:
    paths:
      - 'events-view.js'
      - 'events-polish.css'
      - 'index.html'
      - 'tests/events-visual-browser.mjs'
      - '.github/workflows/events-layout-review.yml'
permissions:
  contents: read
jobs:
  visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate event browser test syntax
        run: node --check tests/events-visual-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Serve actual game
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/events-layout-server.log 2>&1 &
          sleep 2
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
      - name: Test real meeting, calendar and all five Deal Day sessions on desktop and mobile
        run: node tests/events-visual-browser.mjs
      - name: Upload actual Chromium screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deal-day-meetings-desktop-phone
          path: review/diary-*.png
          retention-days: 7
          if-no-files-found: warn
